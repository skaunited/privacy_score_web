# REVIEW AND MERGE; this is a server-context snippet, not a complete vhost.
# Keep one effective copy of each header. Plesk/Apache/Cloudflare may already set it.
# Retain existing certificate, host redirect, compression, routing and 404 settings.
# Do not paste server {}, http {}, location / {}, or location = /404.html {} blocks
# into Plesk Additional nginx directives when the generated vhost supplies them.

# Preserve the existing HSTS policy supplied by the owner; do not add it twice.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Fonts are self-hosted. Analytics is allowed by CSP but loaded only after consent.
# Add only a verified GA4 measurement ID via PUBLIC_GA_MEASUREMENT_ID at build time.
# Keep 'unsafe-inline' while the generated site uses inline bootstrap/style code.
# This policy does not itself enable analytics, create consent, or authorize tags.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

# HTML must be revalidated so an old language-detection root page is not reused.
# The variables are defined in server context, so no http-level map or competing
# location is required. Existing location-level settings still need verification.
set $privacy_score_expires -1;
set $privacy_score_asset_cache "";
if ($uri ~ "^/_astro/") {
    set $privacy_score_expires 1y;
    set $privacy_score_asset_cache "public, immutable";
}
if ($uri ~ "^/assets/") {
    set $privacy_score_expires 1h;
}
expires $privacy_score_expires;
add_header Cache-Control $privacy_score_asset_cache;
