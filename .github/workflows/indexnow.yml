name: IndexNow after production deployment

on:
  workflow_run:
    workflows: ['Test, build and publish']
    types: [completed]
    branches: [main]
  # Plesk is pulled manually, possibly long after the build. Verify hourly,
  # outside the start-of-hour peak; never submit before the public HTML matches.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out trusted main tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Read the latest public build from deploy
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/deploy
          mkdir -p .indexnow/build
          if git cat-file -e FETCH_HEAD:indexnow-manifest.json 2>/dev/null; then
            git show FETCH_HEAD:indexnow-manifest.json > .indexnow/build/indexnow-manifest.json
          fi

      - name: Restore the last successful submission receipt
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .indexnow/state.json
          key: indexnow-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-state-v1-

      - name: Verify public deployment and notify IndexNow
        id: submit
        run: node scripts/submit-indexnow.mjs .indexnow/build

      - name: Retain the successful receipt for incremental submissions
        if: steps.submit.outputs.state_changed == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .indexnow/state.json
          key: indexnow-state-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the production checks and IndexNow receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: indexnow-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/indexnow/
          if-no-files-found: ignore
          retention-days: 30
